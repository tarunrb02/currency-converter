<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form action="">
            <div class="amount">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" value="1" step="0.1" required>
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From:</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="">
                        <select id="fromCurrency" name="fromCurrency">
                        </select>
                    </div>
                </div>

                <i class="fas fa-exchange-alt"></i>
                
                <div class="to">
                    <p>To:</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="">
                        <select id="toCurrency" name="toCurrency">
                        </select>
                    </div>
                </div>
            </div>
            <div class="msg">

            </div>
            <button id="getRateBtn">Get Exchange Rate</button>
        </form>
    </div>
    <script src="codes.js"></script>
    <script src="App.js"></script>
</body>
</html>
